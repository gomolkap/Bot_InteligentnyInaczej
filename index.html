<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>JS Lab</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #f2f2f2;
      font-family: Arial, serif;
    }

    h1 {
      color: #0B3954;
    }

    #chat {
      width: 400px;
      height: 300px;
      background: white;
      border: 1px solid #ccc;
      padding: 10px;
      overflow-y: auto;
      margin-bottom: 10px;
    }

    .user { color: blue; margin: 5px 0; }
    .bot { color: green; margin: 5px 0; }
    .botNie { color: red; margin: 5px 0; }

  </style>
</head>
<body>
<script>

  const chat = document.getElementById("chat");

  function readValues(){
    const input = document.getElementById("myTextField");
    const text = input.value

    if (text === "") return;

    if (text.toLowerCase().includes("motyla noga")) {
      alert("Uwaga! Wulgaryzmy są zabronione.");
      chat.innerHTML += `<div class="botNie"><b>Bot:</b> proszę, nie używaj takich słów</div>`;
      input.value = "";
      return;
    }

    chat.innerHTML += `<div class="user"><b>Ja:</b> ${text}</div>`;

    const response = getBotResponse(text);

    input.value = "";

    setTimeout(function(){
      chat.innerHTML += `<div class="bot"><b>Bot:</b> ${response}</div>`;
      chat.scrollTop = chat.scrollHeight;
    }, 1000);

  }

  function getBotResponse(userText) {

    const text = userText.toLowerCase();

    if (userText.toLowerCase().includes("Cześć")) return "Cześć, co tam?";
    if (userText.toLowerCase().includes("/version")) return "Wersja oprogramowania: v1.2.3";
    if (userText.toLowerCase().includes("/pogoda kraków")) return "W kraków jest 22 stopnie";

    return "Przykro mi, moje odpowiedzi są ograniczone. Musisz zadawać właściwe pytania (pozdrowienia dla fanów filmu Ja, robot)";
  }

  document.getElementById("myTextField").addEventListener("keypress", function(e){
    if (e.key === "Enter") {
      readValues();
    }
  });
</script>

<h2>Chat z botem nieinteligentnym</h2>

<div id="chat">
  <div class="bot"><b>Bot:</b> Cześć, jak tam zajęcia z JS?</div>
</div>

<input type="text" id="myTextField" placeholder="Co tam?" style="width:250px;">
<button type="button" onclick="readValues()">Wyślij wiadomość do bota</button>

</body>
</html>
