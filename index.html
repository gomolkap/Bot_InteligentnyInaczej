<body>
<script>

  function readValues(){
    const isChecked = document.getElementById("myCheckbox").checked;
    if (isChecked) {
      alert(document.getElementById("myTextField").value);
    }
  }

</script>
<input type="text" id="myTextField">
<button type="button" onclick="readValues()">Wyślij wiadomość do bota</button>
